name: Release

# Se dispara solo cuando el CI de un push a main termina bien: nunca se publica con el CI en rojo.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches:
      - main

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  contents: read

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    # head_sha == github.sha: solo publica si main no avanzó desde el commit que validó el CI
    # (changesets/action usa GITHUB_SHA, que en workflow_run es la punta de main); si avanzó,
    # lo publica el CI del commit más nuevo.
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' && github.event.workflow_run.head_sha == github.sha
    permissions:
      contents: write
      pull-requests: write
      id-token: write # OIDC trusted publishing + provenance
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0
          # El commit que validó el CI (main pudo avanzar desde entonces).
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Setup pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Setup Node 24
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 24.x
          cache: pnpm
          # no registry-url: avoids a generated .npmrc with an empty NODE_AUTH_TOKEN competing with OIDC

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm exec changeset publish
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PNPM_CONFIG_PROVENANCE: "true"
          # Bootstrap only (first publish creates the package). Removed in U6b.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
